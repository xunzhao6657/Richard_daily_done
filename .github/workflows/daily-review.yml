name: A-share post-market review

on:
  schedule:
    - cron: "15 11 * * *"
    - cron: "40 11 * * *"
    - cron: "0 12 * * *"
    - cron: "2 12 * * *"
    - cron: "15 12 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: Workflow stage
        required: true
        default: run
        type: choice
        options:
          - doctor
          - collect
          - prepare
          - publish
          - watchdog
          - run
          - reconcile
          - backup
          - status
      mode:
        description: Publication mode
        required: true
        default: shadow
        type: choice
        options:
          - shadow
          - production
      report_date:
        description: Beijing report date YYYY-MM-DD or blank for today
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: post-market-review-${{ github.event.schedule || inputs.action || 'manual' }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64, post-market-review]
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONPATH: ${{ github.workspace }}\src
      PYTHON_EXE: ${{ vars.PYTHON_EXE }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_SECRET_FILE: ${{ vars.DEEPSEEK_SECRET_FILE }}
      DEEPSEEK_BUDGET_ROOT: ${{ vars.DEEPSEEK_BUDGET_ROOT }}
      WIND_CLI_PATH: ${{ vars.WIND_CLI_PATH }}
      REVIEW_STATE_ROOT: ${{ vars.REVIEW_STATE_ROOT }}
      REVIEW_REPORT_ROOT: ${{ vars.REVIEW_REPORT_ROOT }}
      MORNING_REPORT_ROOT: ${{ vars.MORNING_REPORT_ROOT }}
      SCHEDULE_MODE: ${{ vars.REVIEW_MODE }}
    steps:
      - name: Checkout immutable workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate pinned local Python
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath $env:PYTHON_EXE -PathType Leaf)) { throw 'PYTHON_EXE is missing.' }
          & $env:PYTHON_EXE -c "import sys; assert sys.version_info >= (3, 11)"
      - name: Install locked dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pip install --disable-pip-version-check -r requirements.lock
      - name: Run contract tests
        shell: powershell
        run: '& $env:PYTHON_EXE -m unittest discover -s tests'

      - name: Resolve Beijing date and stage
        id: route
        shell: powershell
        run: |
          $stage = "${{ inputs.action }}"
          $mode = "${{ inputs.mode }}"
          $reportDate = "${{ inputs.report_date }}"
          if ([string]::IsNullOrWhiteSpace($mode)) { $mode = $env:SCHEDULE_MODE }
          if ([string]::IsNullOrWhiteSpace($mode)) { $mode = 'production' }
          if ([string]::IsNullOrWhiteSpace($reportDate)) {
            $reportDate = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'China Standard Time').ToString('yyyy-MM-dd')
          }
          if ([string]::IsNullOrWhiteSpace($stage)) {
            $stage = switch ("${{ github.event.schedule }}") {
              '15 11 * * *' { 'collect' }
              '40 11 * * *' { 'prepare' }
              '0 12 * * *' { 'publish' }
              '2 12 * * *' { 'watchdog' }
              '15 12 * * *' { 'backup' }
              '30 22 * * *' { 'reconcile' }
              default { 'status' }
            }
          }
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "stage=$stage`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "mode=$mode`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "report_date=$reportDate`n", $utf8)

      - name: Execute stage
        shell: powershell
        run: |
          $stage = '${{ steps.route.outputs.stage }}'
          $reportDate = '${{ steps.route.outputs.report_date }}'
          $mode = '${{ steps.route.outputs.mode }}'
          if ($stage -in @('collect', 'prepare', 'run')) {
            & $env:PYTHON_EXE -m post_market_review --config config/runtime.json doctor --redact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($stage -eq 'doctor') {
            & $env:PYTHON_EXE -m post_market_review --config config/runtime.json doctor --redact --probe-model
          } elseif ($stage -eq 'backup') {
            & $env:PYTHON_EXE -m post_market_review --config config/runtime.json backup
          } elseif ($stage -eq 'collect') {
            & $env:PYTHON_EXE -m post_market_review --config config/runtime.json collect --date $reportDate
          } else {
            & $env:PYTHON_EXE -m post_market_review --config config/runtime.json $stage --date $reportDate --mode $mode
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload sanitized publication package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-market-review-${{ steps.route.outputs.stage }}-${{ github.run_id }}
          path: .runtime/outbox/**
          if-no-files-found: ignore
          retention-days: 30
