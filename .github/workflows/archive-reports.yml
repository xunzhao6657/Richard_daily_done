name: Archive sanitized reports

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_run:
    workflows:
      - A-share post-market review
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, post-market-review]
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHON_EXE: ${{ vars.PYTHON_EXE }}
      MORNING_REPORT_ROOT: ${{ vars.MORNING_REPORT_ROOT }}
      REVIEW_REPORT_ROOT: ${{ vars.REVIEW_REPORT_ROOT }}
    steps:
      - name: Checkout report archive
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate local report roots
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath $env:PYTHON_EXE -PathType Leaf)) { throw 'PYTHON_EXE is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:MORNING_REPORT_ROOT)) { throw 'MORNING_REPORT_ROOT is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:REVIEW_REPORT_ROOT)) { throw 'REVIEW_REPORT_ROOT is missing.' }
          if (-not (Test-Path -LiteralPath $env:MORNING_REPORT_ROOT -PathType Container)) { throw 'MORNING_REPORT_ROOT is unavailable.' }
          if (-not (Test-Path -LiteralPath $env:REVIEW_REPORT_ROOT -PathType Container)) { throw 'REVIEW_REPORT_ROOT is unavailable.' }

      - name: Archive allowlisted final HTML
        shell: powershell
        run: |
          & $env:PYTHON_EXE scripts/archive_pages_reports.py `
            --morning-root $env:MORNING_REPORT_ROOT `
            --review-root $env:REVIEW_REPORT_ROOT `
            --output published-reports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit new report history
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- published-reports
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            'No new public reports.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          git commit -m 'Archive sanitized report HTML'
          git pull --rebase origin main
          git push origin HEAD:main
